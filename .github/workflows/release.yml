name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack
        shell: pwsh
        run: |
          npm pack
          Move-Item (Get-ChildItem *.tgz | Select-Object -First 1).FullName dsh-super-wechat-bot.tgz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-super-wechat-bot.tgz
          generate_release_notes: true
